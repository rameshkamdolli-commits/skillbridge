```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | SkillBridge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 22px 7%;
        }

        main {
            max-width: 750px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #0000000a;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 18px 0 7px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button, .back {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            margin-top: 22px;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #e2e8f0;
            color: #1e293b;
            margin-left: 8px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 7px;
        }

        .help {
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>SkillBridge Recruiter Portal</h1>
    <p>Create a job listing for students.</p>
</header>

<main>
    <div class="card">
        <h2>Post a New Job</h2>
        <p>Enter the job details below.</p>

        {% if messages %}
            {% for message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'post_job' %}">
            {% csrf_token %}

            <label for="title">Job Title *</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ request.POST.title|default:'' }}"
                placeholder="Python Developer Intern"
                required
            >

            <label for="company">Company Name *</label>
            <input
                type="text"
                id="company"
                name="company"
             value="{{ profile.company_name }}"
                placeholder="SkillBridge Technologies"
                required
            >

            <label for="location">Location *</label>
            <input
                type="text"
                id="location"
                name="location"
                value="{{ request.POST.location|default:'' }}"
                placeholder="Bengaluru"
                required
            >

            <label for="salary">Salary *</label>
            <input
                type="text"
                id="salary"
                name="salary"
                value="{{ request.POST.salary|default:'' }}"
                placeholder="₹15,000 per month"
                required
            >

            <label for="required_skills">Required Skills *</label>
            <textarea
                id="required_skills"
                name="required_skills"
                placeholder="Python, Django, SQL, HTML, CSS"
                required
            >{{ request.POST.required_skills|default:'' }}</textarea>

            <label for="description">Job Description *</label>
            <textarea
                id="description"
                name="description"
                placeholder="Describe the role and responsibilities..."
                required
            >{{ request.POST.description|default:'' }}</textarea>

            <button type="submit">Publish Job</button>

            <a class="back" href="{% url 'recruiter_dashboard' %}">
                Cancel
            </a>
        </form>
    </div>
</main>

</body>
</html>
